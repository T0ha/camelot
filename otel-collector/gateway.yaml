# Cluster gateway: the single egress point for telemetry.
#
# Receives OTLP from the per-node agents and, later, directly from the
# Camelot backend (traces). It is the only component holding vendor
# credentials, and the only place routing changes have to be made.
#
#   logs, traces and metrics -> PostHog
#
# Runs as a single replica, pinned by node label to a node with enough
# memory - see README.md.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64

  batch:
    timeout: 10s
    send_batch_size: 512
    send_batch_max_size: 1024

  # Severity parsers keep whatever word the application used, so Elixir
  # emits "warning" and "notice". PostHog filters severity by exact
  # match against six lowercase buckets (trace/debug/info/warn/error/
  # fatal), so "warning" would never match a warn filter and the level
  # would look parsed while still being unfilterable. The number is
  # already correct, so rewrite the text from it, using the OTel
  # severity ranges PostHog documents.
  #
  # Here rather than on the agent so it covers every log that leaves the
  # cluster, whatever produced it. Records we could not parse keep
  # severity_number 0 and fall through untouched.
  transform/normalize_severity:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(severity_text, "trace") where severity_number >= 1 and severity_number <= 4
          - set(severity_text, "debug") where severity_number >= 5 and severity_number <= 8
          - set(severity_text, "info") where severity_number >= 9 and severity_number <= 12
          - set(severity_text, "warn") where severity_number >= 13 and severity_number <= 16
          - set(severity_text, "error") where severity_number >= 17 and severity_number <= 20
          - set(severity_text, "fatal") where severity_number >= 21 and severity_number <= 24

  # Marks which cluster the telemetry came from, so test and production
  # stay distinguishable once both report into the same PostHog project.
  resource/deployment:
    attributes:
      - key: deployment.environment.name
        value: ${env:DEPLOYMENT_ENV:-test}
        action: upsert

exporters:
  # PostHog speaks OTLP/HTTP but on non-standard paths (/i/v1/...). The
  # per-signal *_endpoint overrides are mandatory: the plain `endpoint`
  # field would append the spec paths /v1/logs and /v1/traces and 404.
  otlphttp/posthog:
    logs_endpoint: ${env:POSTHOG_HOST:-https://us.i.posthog.com}/i/v1/logs
    traces_endpoint: ${env:POSTHOG_HOST:-https://us.i.posthog.com}/i/v1/traces
    metrics_endpoint: ${env:POSTHOG_HOST:-https://us.i.posthog.com}/i/v1/metrics
    # The project token (phc_...), not a personal API key.
    headers:
      Authorization: Bearer ${env:POSTHOG_PROJECT_API_KEY}
    compression: gzip
    # Above the 30s default: batches are small, but the first start
    # ships an accumulated backlog and a slow-but-successful request
    # should not be abandoned into a retry.
    timeout: 60s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 120s
    sending_queue:
      enabled: true
      queue_size: 1000

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: ${env:OTEL_LOG_LEVEL:-warn}
  pipelines:
    logs:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resource/deployment
        - transform/normalize_severity
        - batch
      exporters: [otlphttp/posthog]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/deployment, batch]
      exporters: [otlphttp/posthog]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/deployment, batch]
      exporters: [otlphttp/posthog]
