name: Run code checks and tests
on:
  push:
    branches-ignore:
      - main
      - develop

# Only the newest run per branch survives: merging several PRs in a row
# should not leave a queue of superseded check/build/deploy runs behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    
jobs:
  tests:
    name: Run code checks and tests
    uses: ./.github/workflows/code-checks.yml
    secrets: inherit

