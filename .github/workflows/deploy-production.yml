name: Deploy to Production
on:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/t0ha/camelotai

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve merged develop commit
        id: image
        run: |
          # main is updated via merge-commit PRs from develop, so the second
          # parent (HEAD^2) is the develop tip whose image was built & tested.
          sha=$(git rev-parse HEAD^2 2>/dev/null) || {
            echo "::error::HEAD has no second parent - main must be updated" \
                 "via a merge commit from develop (no rebuild happens here)."
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying image built for develop commit $sha"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists
        run: |
          ref="${{ env.IMAGE }}:${{ steps.image.outputs.sha }}"
          docker buildx imagetools inspect "$ref" >/dev/null || {
            echo "::error::$ref not found in registry - was develop built?"
            exit 1
          }

      # Pin the caprover CLI: the caprover/deploy-from-github action
      # installs it unpinned, and caprover 2.4.0 (2026-08-05) bumped
      # commander (duplicate -t flag crash) and update-notifier (ESM
      # require crash), breaking every deploy. 2.3.1 is the last good
      # release. --caproverUrl auto-prepends https://captain. to the
      # root domain.
      - name: Deploy Image to CapRover (production)
        env:
          CAPROVER_URL: "${{ vars.CAPROVER_SERVER }}"
          CAPROVER_APP_TOKEN: "${{ secrets.APP_TOKEN }}"
          CAPROVER_IMAGE_NAME: "${{ env.IMAGE }}:${{ steps.image.outputs.sha }}"
        run: |
          npx --yes caprover@2.3.1 deploy \
            --caproverUrl "$CAPROVER_URL" \
            --appToken "$CAPROVER_APP_TOKEN" \
            --appName "${{ vars.APP_NAME }}" \
            --imageName "$CAPROVER_IMAGE_NAME"
